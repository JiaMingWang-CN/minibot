# 发布流水线：推送 v* 标签触发，构建 Windows 安装包与安卓 APK，发到同一个 GitHub Release。
# 流程：校验标签与根版本 → 先建草稿 Release → 两端各自构建并上传到草稿 → 都成功后发布草稿。
# 带 -rc.N 后缀的标签发布为 prerelease（releases/latest 与 electron-updater 默认都忽略 prerelease）。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MINIBOT_COLLECT_URL: ${{ vars.MINIBOT_COLLECT_URL }}
    steps:
      - uses: actions/checkout@v4
      # 标签去掉可选的 -rc.N 后缀后必须等于根 package.json 的 version，不符直接失败
      - name: 校验标签与根版本一致
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "标签 $GITHUB_REF_NAME 不是 vX.Y.Z 或 vX.Y.Z-rc.N"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME%-rc.*}"
          TAG="${TAG#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "标签 $GITHUB_REF_NAME 与根版本 $VERSION 不一致"
            exit 1
          fi
      # 收集点地址为空时上传与反馈会被悄悄关闭；正式发版必须配置
      - name: 校验收集点地址已配置
        run: |
          if [ -z "$MINIBOT_COLLECT_URL" ]; then
            echo "仓库 Variable MINIBOT_COLLECT_URL 未配置：诊断上传与反馈会在客户端整体关闭。"
            exit 1
          fi

  # 先单独建好草稿 Release：两端都往同一个草稿上传，避免 electron-builder 按版本号另建一个
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 建草稿 Release（正文取标签注释）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/checkout@v4 会把附注标签覆盖成指向提交的轻量标签，这里重新拉取标签对象本身
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME 不是附注标签：请用 git tag -a $GITHUB_REF_NAME -m \"更新说明\" 打标签"
            exit 1
          fi
          NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 已正式发布的版本不能被改回草稿，否则会从 releases/latest 消失、客户端更新落回旧版
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)" != true ]; then
              echo "$GITHUB_REF_NAME 已正式发布，拒绝重跑；如需重发请改用新版本号"
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "minibot $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "minibot $GITHUB_REF_NAME" --notes "$NOTES"
          fi

  desktop:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      MINIBOT_COLLECT_URL: ${{ vars.MINIBOT_COLLECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-version.mjs
      # npm run build 会把 MINIBOT_COLLECT_URL 写进 dist/build-info.json
      - run: npm run build
      - name: 打包 NSIS 安装包（不自动发布）
        run: npm run pack --workspace @minibot/desktop
      - name: 上传安装包到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "$GITHUB_REF_NAME" \
            "apps/desktop/release/minibot-setup-$VERSION.exe" \
            "apps/desktop/release/minibot-setup-$VERSION.exe.blockmap" \
            "apps/desktop/release/latest.yml" \
            --clobber

  android:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MINIBOT_COLLECT_URL: ${{ vars.MINIBOT_COLLECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      # 签名密钥只写进作业的临时目录，作业结束即销毁，不作为 artifact 上传
      - name: 还原签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIBOT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/minibot.jks"
          if [ ! -s "$RUNNER_TEMP/minibot.jks" ]; then
            echo "Secret MINIBOT_KEYSTORE_BASE64 为空或无法解码"
            exit 1
          fi
      - run: npm ci
      - run: node scripts/sync-version.mjs
      # 手机网页层依赖 @minibot/core 的构建产物（dist 不在仓库里）
      - run: npm run build --workspace @minibot/core
      - run: npm run apk --workspace @minibot/mobile
        env:
          MINIBOT_KEYSTORE: ${{ runner.temp }}/minibot.jks
          MINIBOT_KEYSTORE_PASSWORD: ${{ secrets.MINIBOT_KEYSTORE_PASSWORD }}
          MINIBOT_KEY_ALIAS: ${{ secrets.MINIBOT_KEY_ALIAS }}
          MINIBOT_KEY_PASSWORD: ${{ secrets.MINIBOT_KEY_PASSWORD }}
      - name: 重命名 APK 并生成校验文件
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "minibot-$VERSION.apk"
          sha256sum "minibot-$VERSION.apk" | cut -d' ' -f1 > "minibot-$VERSION.apk.sha256"
      - name: 上传 APK 到草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "$GITHUB_REF_NAME" "minibot-$VERSION.apk" "minibot-$VERSION.apk.sha256" --clobber

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 发布草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -rc 发 prerelease；正式版标记 latest。二者互斥，不能同时带。
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
