apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

import groovy.json.JsonSlurper

// 版本号单一来源是根 package.json：versionName = X.Y.Z，versionCode = major*10000 + minor*100 + patch
def rootVersion = { ->
    def parsed = new JsonSlurper().parse(file('../../../../package.json'))
    def match = (parsed.version.toString() =~ /^(\d+)\.(\d+)\.(\d+)$/)
    if (!match.find()) throw new GradleException("根 package.json 的 version 不是 X.Y.Z：${parsed.version}")
    return [match.group(1).toInteger(), match.group(2).toInteger(), match.group(3).toInteger()]
}()
def versionMajor = rootVersion[0]
def versionMinor = rootVersion[1]
def versionPatch = rootVersion[2]
def computedVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
println "minibot android versionName=${versionMajor}.${versionMinor}.${versionPatch} versionCode=${computedVersionCode}"

android {
    namespace = "app.minibot.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.minibot.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"
        // 收集点地址只在构建时注入，源码里没有默认值；空串表示上传与反馈整体关闭
        def collectUrl = System.getenv('MINIBOT_COLLECT_URL') ?: ''
        buildConfigField "String", "COLLECT_URL", "\"${collectUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            // 签名信息只从环境变量读取；缺任何一个都让 release 构建失败，不回退到 debug 签名
            def required = ['MINIBOT_KEYSTORE', 'MINIBOT_KEYSTORE_PASSWORD', 'MINIBOT_KEY_ALIAS', 'MINIBOT_KEY_PASSWORD']
            def missing = required.findAll { System.getenv(it) == null || System.getenv(it).isEmpty() }
            if (missing.isEmpty()) {
                storeFile file(System.getenv('MINIBOT_KEYSTORE'))
                storePassword System.getenv('MINIBOT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MINIBOT_KEY_ALIAS')
                keyPassword System.getenv('MINIBOT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        // 测试夹具与电脑端共用同一份
        test.resources.srcDirs += ['../../../../packages/core/test/fixtures']
    }
    testOptions {
        unitTests.all { maxHeapSize = '1g' }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Kotlin 2.2 起 kotlinOptions 已是错误级弃用，改用 compilerOptions
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinCoroutinesVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "org.bouncycastle:bcprov-jdk18on:$bouncyCastleVersion"
    implementation "com.journeyapps:zxing-android-embedded:$zxingEmbeddedVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:$orgJsonVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinCoroutinesVersion"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 缺少签名环境变量时，release 打包直接失败并指出缺哪个
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name ==~ /(?i)(assemble|bundle|package)Release.*/ }
    if (releasing) {
        def required = ['MINIBOT_KEYSTORE', 'MINIBOT_KEYSTORE_PASSWORD', 'MINIBOT_KEY_ALIAS', 'MINIBOT_KEY_PASSWORD']
        def missing = required.findAll { System.getenv(it) == null || System.getenv(it).isEmpty() }
        if (!missing.isEmpty()) {
            throw new GradleException("缺少签名环境变量：" + missing.join('、') + "（见 apps/mobile/README.md）")
        }
    }
}
