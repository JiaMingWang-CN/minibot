name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 构建包含核心、桌面端的 tsc 类型检查和渲染端的 tsc + vite build
      - run: npm run build
      - run: npm test
